name: Build & Release APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest, overwrites the same release page)'
        required: false
        default: 'latest'

permissions:
  contents: write

# One run per branch: a newer push supersedes the previous one instead of
# queueing behind it and racing it for the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # setup-java only caches ~/.gradle. Robolectric resolves its
      # android-all jars into ~/.m2, which is cold on every run otherwise.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/src/test/**/*.kt') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --parallel --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  build-release:
    name: Build APK
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: test` — the two jobs run side by side. The
    # publish job below is the gate, so an APK is built even when tests fail,
    # but nothing is released unless both succeed.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode and create xed.keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/xed.keystore
          else
            touch /tmp/xed.keystore
          fi

      - name: Decode and create signing.properties
        run: |
          if [ -n "${{ secrets.PROP }}" ]; then
            echo "${{ secrets.PROP }}" | base64 -d > /tmp/signing.properties
          else
            touch /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --parallel

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk app/wolfi-terminal-latest.apk

      - name: Delete xed.keystore and signing.properties
        run: rm -f /tmp/xed.keystore /tmp/signing.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/wolfi-terminal-latest.apk
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [test, build-release]
    # The gate. Success requires tests AND a built APK, which is the same
    # guarantee the old `needs: test` provided — just without serialising
    # the two jobs. On non-main branches build-release is skipped, so this
    # job is skipped too.
    if: always() && needs.test.result == 'success' && needs.build-release.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app

      - name: Verify APK
        run: |
          ls -la app
          test -s app/wolfi-terminal-latest.apk

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: 'Wolfi Terminal latest (${{ env.COMMIT_HASH }})'
          body: |
            🐺📱 **Wolfi Terminal APK (rolling release)**

            Same page, updated file on every release.

            - Commit: `${{ env.COMMIT_HASH }}`
            - Built from: `main` (or manual trigger)
            - Distros: Wolfi (on-demand download) + Alpine (bundled) + Android shell

            ### 📥 Download

            | File | Use for |
            |------|---------|
            | `wolfi-terminal-latest.apk` | Install / update on device |

            Direct link: https://github.com/leloush-x/wolfi-terminal/releases/latest/download/wolfi-terminal-latest.apk
          files: app/wolfi-terminal-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
