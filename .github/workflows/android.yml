name: Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest, overwrites the same release page)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode and create xed.keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/xed.keystore
          else
            touch /tmp/xed.keystore
          fi

      - name: Decode and create signing.properties
        run: |
          if [ -n "${{ secrets.PROP }}" ]; then
            echo "${{ secrets.PROP }}" | base64 -d > /tmp/signing.properties
          else
            touch /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease --parallel

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk app/reterminal-latest.apk

      - name: Delete xed.keystore and signing.properties
        run: rm -f /tmp/xed.keystore /tmp/signing.properties

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: 'ReTerminal latest (${{ env.COMMIT_HASH }})'
          body: |
            📱 **ReTerminal APK (rolling release)**

            Same page, updated file on every release — just like the rootfs repo.

            - Commit: `${{ env.COMMIT_HASH }}`
            - Built from: `main` (or manual trigger)

            ### 📥 Download

            | File | Use for |
            |------|---------|
            | `reterminal-latest.apk` | Install / update on device |
          files: app/reterminal-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
