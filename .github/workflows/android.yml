name: Build & Release APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.3.1; latest overwrites the rolling release)'
        required: false
        default: 'latest'

permissions:
  contents: write

# One run per branch: a newer push supersedes the previous one instead of
# queueing behind it and racing it for the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # setup-java only caches ~/.gradle. Robolectric resolves its
      # android-all jars into ~/.m2, which is cold on every run otherwise.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/src/test/**/*.kt') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --parallel --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    # Every branch gets debug and test-key release APKs so release-only
    # configuration can be checked before changes are merged.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare test signing key for release verification
        run: |
          cp app/testkey.keystore /tmp/xed.keystore
          cat > /tmp/signing.properties <<'EOF'
          keyAlias=testkey
          keyPassword=testkey
          storePassword=testkey
          EOF

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --parallel

      - name: Verify release APK signature uses the test key
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          EXPECTED="$(keytool -exportcert -alias testkey -keystore app/testkey.keystore -storepass testkey | openssl dgst -sha256 -r | awk '{print tolower($1)}')"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERTS"
          ACTUAL="$(printf '%s\n' "$CERTS" | awk -F ': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print tolower($NF); exit}')"
          printf 'Expected test-key SHA-256: %s\nAPK signer SHA-256: %s\n' "$EXPECTED" "$ACTUAL"
          test -n "$APK" && test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"

      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: verified-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-release:
    name: Build APK
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: test` — the two jobs run side by side. The
    # publish job below is the gate, so an APK is built even when tests fail,
    # but nothing is released unless both succeed.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare test signing key
        run: |
          cp app/testkey.keystore /tmp/xed.keystore
          cat > /tmp/signing.properties <<'EOF'
          keyAlias=testkey
          keyPassword=testkey
          storePassword=testkey
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --parallel

      - name: Verify release APK signature uses the test key
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          EXPECTED="$(keytool -exportcert -alias testkey -keystore app/testkey.keystore -storepass testkey | openssl dgst -sha256 -r | awk '{print tolower($1)}')"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERTS"
          ACTUAL="$(printf '%s\n' "$CERTS" | awk -F ': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print tolower($NF); exit}')"
          printf 'Expected test-key SHA-256: %s\nAPK signer SHA-256: %s\n' "$EXPECTED" "$ACTUAL"
          test -n "$APK" && test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"

      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          case "$RELEASE_TAG" in
            ''|*[!A-Za-z0-9._-]*) echo 'Invalid release tag for asset filename' >&2; exit 1 ;;
          esac
          APK="app/wolfi-terminal-${RELEASE_TAG}.apk"
          mv app/build/outputs/apk/release/*.apk "$APK"
          if [ "$RELEASE_TAG" != latest ]; then
            cp "$APK" app/wolfi-terminal-latest.apk
          fi

      - name: Delete xed.keystore and signing.properties
        run: rm -f /tmp/xed.keystore /tmp/signing.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: 'app/wolfi-terminal-*.apk'
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [test, build-release]
    # The gate. Success requires tests AND a built APK, which is the same
    # guarantee the old `needs: test` provided — just without serialising
    # the two jobs. On non-main branches build-release is skipped, so this
    # job is skipped too.
    if: always() && needs.test.result == 'success' && needs.build-release.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: app
      - name: Verify APK and write release metadata
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          APK="app/wolfi-terminal-${RELEASE_TAG}.apk"
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if [ "$RELEASE_TAG" != latest ]; then
            cp "$APK" app/wolfi-terminal-latest.apk
          fi
          sha256sum app/wolfi-terminal-latest.apk > app/wolfi-terminal-latest.apk.sha256
          python3 - "$APK" <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess, sys
          apk = pathlib.Path(sys.argv[1])
          version_text = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', version_text).group(1)
          manifest = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'versionName': version,
              'tag': os.environ['RELEASE_TAG'],
              'apk': apk.name,
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'published': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path('app/version.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Verify APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: test -s "app/wolfi-terminal-${RELEASE_TAG}.apk"

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: 'Wolfi Terminal latest (${{ env.COMMIT_HASH }})'
          body: |
            🐺📱 **Wolfi Terminal ${{ github.event.inputs.tag || 'latest' }}**

            Same page, updated file on every release.

            - Commit: `${{ env.COMMIT_HASH }}`
            - Built from: `main` (or manual trigger)
            - Distros: Wolfi, Debian, Void (on-demand download) + Alpine (bundled) + Android shell

            ### 📥 Download

            | File | Use for |
            |------|---------|
            | `wolfi-terminal-${{ github.event.inputs.tag || 'latest' }}.apk` | New install |
            | `wolfi-terminal-latest.apk` | Stable download link |

            This release returns to the original `com.wolfi.terminal` package and test key. It can update matching installs; the previous `.secure` package remains separate, with no data migration.

            Direct link: https://github.com/leloush-x/wolfi-terminal/releases/latest/download/wolfi-terminal-latest.apk
          files: |
            app/wolfi-terminal-*.apk
            app/wolfi-terminal-*.apk.sha256
            app/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
